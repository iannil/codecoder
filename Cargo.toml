[package]
name = "codecoder"
version = "0.1.0"
edition = "2024"
description = "Autonomous AI agent — event-driven, filesystem-as-self"

[[bin]]
name = "ccda"
path = "src/bin/ccda.rs"

[[bin]]
name = "ccli"
path = "src/bin/ccli.rs"

[[bin]]
name = "ccweb"
path = "src/bin/ccweb.rs"

[dependencies]
# Serialization: unified message model + session persistence (ADR 0015, 0004, 0017)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Errors
anyhow = "1"
thiserror = "2"
# SIGINT → graceful cancel for the headless Background Agent (ADR 0026).
signal-hook = "0.3"
# Blocking HTTP for the Provider — no async runtime, consistent with OS-threads kernel (ADR 0016)
ureq = { version = "2", features = ["json"] }
# Search tools: glob (file patterns) + regex (grep)
glob = "0.3"
regex = "1"
# grep AST queries (tree-sitter) — Rust / Python / JavaScript grammars
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-go = "0.21"
tree-sitter-c = "0.21"
# Accurate token counting for ctx% and compaction (ADR 0023)
tiktoken-rs = "0.6"
# Wasm capability environment: wasmtime + WASI isolation (ADR 0021)
wasmtime = "27"
wasmtime-wasi = "27"
# Advisory file lock for WorkGraph concurrent-write protection (ADR 0035).
fs2 = "0.4"
# File-watcher for ccweb: live-reload on skill/capability changes (Task 1)
notify = { version = "6", features = [] }
# Lightweight HTTP server for ccweb (Task 1)
tiny_http = "0.12"
# LSP (Language Server Protocol) types for LSP tool (Task 3)
lsp-types = "0.97"
# URL parsing for proper file:// URI percent-encoding (used by LSP tool)
url = "2"

[dev-dependencies]
insta = { version = "1", features = ["colors"] }
tempfile = "3"
# L2 pty smoke only (tests/l2_pty_smoke.rs). Gated behind RUN_PTY_SMOKE=1 and
# `#[ignore]`; pulled in solely to spawn the real binary under a pseudo-terminal.
portable-pty = "0.8"
filetime = "0.2.29"

[profile.release]
opt-level = 3
