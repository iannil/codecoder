name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gating job: the hermetic default suite (no network, no API key, no Docker).
  # This is the check that should block merges.
  test:
    name: Test (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo build --tests --locked
      - name: Run default suite
        run: cargo test --locked

  # Non-blocking job: the L2 pty smoke drives the real binary under a
  # pseudo-terminal. pty rendering is timing/terminal-dependent, so a failure here
  # must never block a merge (continue-on-error). The test is self-bounding
  # (reader thread + recv_timeout + kill), and the step also has a hard timeout as
  # defense-in-depth, so a hang can't stall CI.
  pty-smoke:
    name: L2 pty smoke (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run L2 pty smoke
        run: RUN_PTY_SMOKE=1 cargo test --test l2_pty_smoke --locked -- --ignored --nocapture
